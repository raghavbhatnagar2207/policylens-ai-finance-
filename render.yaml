services:
  # -------------------------------------------------------------
  # PolicyLens Flask API Backend Service
  # -------------------------------------------------------------
  - type: web
    name: policylens-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install -r requirements.txt"
    startCommand: "python scripts/seed.py && gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 60 wsgi:app"
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: policylens-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"

  # -------------------------------------------------------------
  # PolicyLens React Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: policylens-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: policylens-api
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # -------------------------------------------------------------
  # Managed PostgreSQL Database
  # -------------------------------------------------------------
  - name: policylens-db
    region: oregon
    plan: free
    databaseName: policylens
    user: policylens
