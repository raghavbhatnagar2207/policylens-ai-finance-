name: PolicyLens AI CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest flake8

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run backend pytest suite
        env:
          FLASK_ENV: testing
        run: |
          cd backend
          pytest tests/ -v

  frontend-build:
    name: Frontend Build & Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

  postgres-integration:
    name: PostgreSQL Migration & Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: policylens_test
          POSTGRES_USER: policylens
          POSTGRES_PASSWORD: test_secure_pass_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt pytest psycopg2-binary

      - name: Verify Flask-Migrate Upgrade on Real PostgreSQL
        env:
          FLASK_APP: backend/run.py
          DATABASE_URL: postgresql://policylens:test_secure_pass_2026@localhost:5432/policylens_test
        run: |
          cd backend
          flask db upgrade

      - name: Run Tests against Real PostgreSQL
        env:
          FLASK_ENV: testing
          DATABASE_URL: postgresql://policylens:test_secure_pass_2026@localhost:5432/policylens_test
        run: |
          cd backend
          pytest tests/ -v

  docker-build:
    name: Production Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build, postgres-integration]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: policylens-backend:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: policylens-frontend:latest
